[metadata]
name = suye
version = 0.1.0
description = Read-only development toolchain diagnostics for SUYE
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/sheng-ke-zhi/suye

[options]
package_dir =
    = python
packages = find:
python_requires = >=3.9

[options.packages.find]
where = python

[options.entry_points]
console_scripts =
    suye = suye.cli:main
